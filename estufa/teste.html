<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link de Notícias</title>
    <style>
        .news-card {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            width: 350px;
            text-decoration: none;
            color: #000;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }

        .news-card:hover {
            transform: scale(1.02);
        }

        .news-card img {
            width: 120px;
            height: 100%;
            object-fit: cover;
        }

        .news-card .content {
            padding: 16px;
        }

        .news-card .title {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }

        .news-card .description {
            font-size: 14px;
            color: #555;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <a href="https://www.seusite.com/noticia" class="news-card">
        <img src="sua-imagem.jpg" alt="Imagem da Notícia">
        <div class="content">
            <h3 class="title">Título da Notícia</h3>
            <p class="description">Breve descrição ou subtítulo da notícia.</p>
        </div>
    </a>
</body>
</html>
