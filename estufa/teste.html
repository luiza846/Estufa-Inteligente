<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link de Notícias</title>
    <style>
        .news-card {
            display: block;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            width: 350px;
            text-decoration: none;
            color: #000;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }

        .news-card:hover {
            transform: scale(1.02);
        }

        .news-card img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .news-card .content {
            padding: 16px;
            text-align: center;
        }

        .news-card .title {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }

        .news-card .description {
            font-size: 14px;
            color: #555;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <a href="https://globoplay.globo.com/v/12498503/" class="news-card">
        <img src="https://media.licdn.com/dms/image/sync/v2/D4E27AQFMCDDf89JDWg/articleshare-shrink_480/articleshare-shrink_480/0/1717096183161?e=1725458400&v=beta&t=geJSe9dqB6uF9In-sBKhUPdH4-f2Fgqx40zcwyEt5k4" alt="Imagem da Notícia">
        <div class="content">
            <h3 class="title">Título da Notícia</h3>
            <p class="description">Breve descrição ou subtítulo da notícia.</p>
        </div>
    </a>

    <a href="https://projetoeducacao.cptec.inpe.br/projetos" class="news-card">
        <img src="https://projetoeducacao.cptec.inpe.br/img/greencode1.png" alt="Imagem da Notícia">
        <div class="content">
            <h3 class="title">Título da Notícia</h3>
            <p class="description">Breve descrição ou subtítulo da notícia.</p>
        </div>
    </a>
</body>
</html>
